name: CI

on:
  push:
    branches: [main]
    # Release tags, one per package (docs/VERSIONING.md in the Plumix repo, scripts/release_plan.sh).
    tags: ['provider-v*.*.*', 'bloc-core-v*.*.*', 'bloc-v*.*.*', 'slang-v*.*.*',
           'google-sign-in-v*.*.*', 'sign-in-with-apple-v*.*.*', 'in-app-purchase-v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ─── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      # net11.0 only here: the platform plugins' Android and iOS builds need workloads (release job, macOS)
      - name: Build
        run: dotnet build src/Plumix.Packages.slnx -c Release -p:PlumixMobileTargets=false

      - name: Test
        run: dotnet test src/Plumix.Packages.slnx -c Release --no-build

      # Smoke-check packaging so broken pack inputs (README, icon, license)
      # surface on every PR instead of only on release tags
      - name: Pack (verify)
        run: dotnet pack src/Plumix.Packages.slnx -c Release --no-build

      # Rebuild and retest against the Plumix version the packed nuspecs actually declare
      # as their minimum, so a package never promises compatibility it was not tested with.
      # Plumix.Bloc.Core (port of the pure-Dart bloc) declares no Plumix dependency at all.
      - name: Test against nuspec Plumix dependency
        run: |
          set -euo pipefail
          deps=$(for pkg in src/Plumix.*/bin/Release/Plumix.*.nupkg; do
            unzip -p "$pkg" '*.nuspec' \
              | sed -n 's/.*<dependency id="Plumix" version="\([^"]*\)".*/\1/p'
          done | sed '/^$/d' | sort -u)
          if [ "$(echo "$deps" | wc -l)" -ne 1 ] || [ -z "$deps" ]; then
            echo "::error::Packages must declare one Plumix dependency, found: $deps"
            exit 1
          fi
          # "X" means >= X; "[X, Y)" is a range — test its lower bound
          min=$(echo "$deps" | sed 's/^[[(]//; s/,.*$//; s/[])]$//; s/ //g')
          echo "Testing against Plumix $min (nuspec: $deps)"
          dotnet test src/Plumix.Packages.slnx -c Release \
            -p:UsePlumixLocal=false -p:PlumixVersion="$min"

  # ─── Canary: newest Plumix on NuGet (non-blocking) ─────────────────────────
  # Warns early when a new Plumix release breaks the packages, before users hit it
  plumix-latest:
    name: Build against latest Plumix
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Test
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/plumix/index.json | jq -r '.versions[-1]')
          echo "Testing against Plumix $latest"
          dotnet test src/Plumix.Packages.slnx -c Release \
            -p:UsePlumixLocal=false -p:PlumixVersion="$latest"

  # ─── Pack & Publish (release tags only) ────────────────────────────────────
  # Any release tag pushes every package at its src/Versions.props version; packages already on
  # nuget.org are skipped as duplicates. scripts/release_plan.sh checks the tag and that every
  # unpublished package is tagged. Runs for tags of one commit push in parallel: --skip-duplicate
  # turns the second push of a version into a no-op (no concurrency group: it cancels queued runs).
  # The platform plugins (GoogleSignIn, SignInWithApple, InAppPurchase) pack net11.0-android and net11.0-ios next to
  # net11.0 into one nupkg; the iOS workload builds only on macOS, so the release packs there. Build and test jobs
  # run on Linux with net11.0 only (PlumixMobileTargets defaults to false off macOS).
  publish:
    name: Pack & Publish to NuGet
    runs-on: xcode-27
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing: GitHub OIDC token -> short-lived API key

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Check tag and plan the release
        run: scripts/release_plan.sh "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      # The .NET 11 iOS workload is built against Xcode 27.2; the image defaults to an earlier one.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Setup Java 17 (Android bindings)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android and iOS workloads
        run: dotnet workload install android ios

      # Versions come from src/Versions.props; never -p:Version (it would restamp the
      # Plumix.Bloc -> Plumix.Bloc.Core floor).
      - name: Pack
        run: dotnet pack src/Plumix.Packages.slnx -c Release -p:PlumixMobileTargets=true --output artifacts/nuget

      - name: Check the platform plugins carry all three targets
        run: |
          set -euo pipefail
          for id in Plumix.GoogleSignIn Plumix.SignInWithApple Plumix.InAppPurchase; do
            pkg=$(ls artifacts/nuget/$id.[0-9]*.nupkg | grep -v snupkg)
            for tfm in net11.0 net11.0-android net11.0-ios; do
              unzip -l "$pkg" | grep -q "lib/$tfm[0-9.]*/$id.dll" || { echo "::error::$pkg has no lib/$tfm"; exit 1; }
            done
          done

      # Trusted publishing policy on nuget.org (owner Plumix, repo Plumix-Net/Plumix.Packages, workflow ci.yml).
      # NUGET_USER is the nuget.org profile name of the policy's creator; the key lives one hour.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Symbol packages (.snupkg) are pushed automatically alongside each .nupkg
      - name: Push to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for stem in $RELEASE_PACKAGES; do
            pkg="artifacts/nuget/${stem}.nupkg"
            if [[ ! -f "$pkg" ]]; then
              echo "::error::NuGet package was not created: $pkg"
              exit 1
            fi
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
